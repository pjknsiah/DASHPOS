# Local development: PostgreSQL, the API and the Vite dev server.
#   docker compose up --build
#   docker compose exec api npx prisma db seed   (first run: sample data + logins)
# App: http://localhost:5173   API: http://localhost:3001
services:
  db:
    image: postgres:15
    environment:
      # The superuser can create databases, which `prisma migrate dev` needs
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos_db
    ports:
      # 5433 on the host, so it doesn't clash with a local PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    # Optional: Paystack keys and other overrides from server/.env
    env_file:
      - path: ./server/.env
        required: false
    environment:
      # These take precedence over server/.env so the API uses the db service
      DATABASE_URL: postgresql://pos:pos@db:5432/pos_db
      NODE_ENV: development
      PORT: "3001"
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-docker-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-docker-dev-refresh-secret-change-me}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      # Live-reload source changes; keep the container's own node_modules
      - ./server:/app
      - /app/node_modules

  web:
    build: ./client
    environment:
      API_PROXY_TARGET: http://api:3001
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  db-data:
